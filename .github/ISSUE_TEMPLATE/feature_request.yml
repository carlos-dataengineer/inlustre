name: Sugerir uma melhoria
description: Uma ferramenta, opção ou ajuste que deixaria o Inlustre melhor
labels: ["melhoria"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve
      description: Conte a situação em que você sentiu falta disso.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você já tentou
